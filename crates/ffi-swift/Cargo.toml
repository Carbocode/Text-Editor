[package]
name = "native-workspace-ffi-swift"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
native-workspace-application = { path = "../application" }
native-workspace-domain = { path = "../domain" }
native-workspace-syntax = { path = "../syntax" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

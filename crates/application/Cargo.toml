[package]
name = "native-workspace-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
devtools = ["dep:native-workspace-devtools-producer"]

[dependencies]
native-workspace-devtools-producer = { path = "../devtools", optional = true }
native-workspace-domain = { path = "../domain" }
native-workspace-filesystem = { path = "../filesystem" }
native-workspace-storage = { path = "../storage" }
thiserror = "2"
serde_json = "1"
ignore = "0.4"
regex = "1"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

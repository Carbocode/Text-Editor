[workspace]
resolver = "3"
members = ["crates/domain", "crates/filesystem", "crates/storage", "crates/application", "crates/syntax", "crates/terminal", "crates/ffi-swift", "apps/gnome", "apps/kde", "tools/xtask", "crates/devtools-protocol", "crates/devtools", "apps/devtools", "apps/devtools-ui"]
default-members = ["crates/domain", "crates/filesystem", "crates/storage", "crates/application"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# Keep backtrace locations without full type/variable debug information. The test
# profile inherits dev, so builds, checks and tests use the same space policy.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies rarely need source debugging, and dominate the build directory.
[profile.dev.package."*"]
debug = false

# Also suppress bundled DuckDB's native C++ debug symbols.
[profile.dev.package.libduckdb-sys]
debug = false

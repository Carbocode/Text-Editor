[package]
name = "native-workspace-gnome"
default-run = "native-workspace-gnome"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["devtools"]
devtools = ["native-workspace-application/devtools"]

[dependencies]
native-workspace-application = { path = "../../crates/application" }
native-workspace-domain = { path = "../../crates/domain" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
native-workspace-syntax = { path = "../../crates/syntax" }

pangocairo = "0.22"

[package]
name = "native-workspace-kde"
default-run = "native-workspace-kde"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["devtools"]
devtools = ["native-workspace-application/devtools"]

[dependencies]
serde_json = "1"
native-workspace-application = { path = "../../crates/application" }
native-workspace-domain = { path = "../../crates/domain" }
native-workspace-syntax = { path = "../../crates/syntax" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10", features = ["qt_minimal"] }
qt-version = { version = "0.1", features = ["qt_version_at_least_6_10"] }
